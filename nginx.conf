map $http_x_forwarded_proto $fwd_scheme {
	default $scheme;
	https   https;
	http    http;
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	charset utf-8;
	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	sub_filter '__SITE_ORIGIN__' '$fwd_scheme://$host';
	sub_filter_once off;
	sub_filter_types text/html text/plain text/xml application/xml;

	location / {
		try_files $uri $uri/ /index.html;
	}
}
