map $http_x_forwarded_proto $fwd_scheme {
	default $scheme;
	https   https;
	http    http;
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	charset utf-8;
	server_tokens off;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

	# Note: add_header in a location replaces the server-level headers, so
	# each location lists the headers it needs.

	sub_filter '__SITE_ORIGIN__' '$fwd_scheme://$host';
	sub_filter_once off;
	sub_filter_types text/html text/plain text/xml application/xml;

	# Hashed build output never changes, so it can be cached forever.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		try_files $uri $uri/ /index.html;
	}
}
